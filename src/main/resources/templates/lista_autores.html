<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema Autores</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" th:href="@{/}">Biblioteca Salarrue</a>
        <ul class="navbar-nav flex-row gap-4">
            <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/autores}">Autores</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/libros}">Libros</a></li>
        </ul>
    </nav>

    <div class="container mt-4">

        <!-- ENCABEZADO CENTRADO -->
        <div class="text-center mb-2">
            <h2 class="mb-0">Autores</h2>
            <p class="text-muted mb-0">Sistema de Gestión de Autores</p>
        </div>

        <!-- BOTÓN VERDE ALINEADO A LA DERECHA -->
        <div class="d-flex justify-content-end mb-3 pe-2">
            <a th:href="@{/autores/new_autor}" class="btn btn-success">
                + Nuevo Autor
            </a>
        </div>

        <!-- TABLA CENTRADA -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <table class="table table-striped table-hover mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Nacionalidad</th>
                                    <th>Opciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="autor : ${autores}">
                                    <td th:text="${autor.id}"></td>
                                    <td th:text="${autor.nombre}"></td>
                                    <td th:text="${autor.nacionalidad}"></td>
                                    <td>
                                        <a th:href="@{/autores/edite/{id}(id=${autor.id})}" class="btn btn-warning btn-sm">Editar</a>
                                        <a th:href="@{/autores/delete/{id}(id=${autor.id})}" class="btn btn-danger btn-sm"
                                           onClick="return confirm('¿Está seguro que desea eliminar el Autor?');">Eliminar</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
