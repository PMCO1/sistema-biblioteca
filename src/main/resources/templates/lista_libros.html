<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Libros</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    .pantalla-completa {
        position: fixed;
        inset: 0;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Inter', sans-serif;
        animation: desvanecer 0.5s ease 2.5s forwards;
    }

    /* Animación de entrada */
    .pantalla-completa .contenido {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: entrada 0.4s ease forwards;
    }

    @keyframes entrada {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes desvanecer {
        to { opacity: 0; visibility: hidden; }
    }

    /* Nombre del sistema */
    .pantalla-completa .sistema-nombre {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #aaa;
        margin-bottom: 2rem;
    }

    /* Círculo del ícono */
    .pantalla-completa .circulo {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem;
        animation: escalar 0.4s ease 0.2s both;
    }

    @keyframes escalar {
        from { transform: scale(0); }
        to   { transform: scale(1); }
    }

    .circulo-exito { background: #d1fae5; }
    .circulo-error { background: #fee2e2; }

    .pantalla-completa .icono-exito { color: #198754; font-size: 3rem; }
    .pantalla-completa .icono-error { color: #dc3545; font-size: 3rem; }

    /* Mensaje */
    .pantalla-completa .mensaje {
        font-size: 1.6rem;
        font-weight: 700;
        color: #1a1a1a;
        margin-bottom: 0.5rem;
    }

    .pantalla-completa .submensaje {
        font-size: 0.95rem;
        color: #888;
    }
</style>
	
</head>
<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" th:href="@{/}">Biblioteca Salarrue</a>
        <ul class="navbar-nav flex-row gap-4">
            <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/autores}">Autores</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/libros}">Libros</a></li>
        </ul>
    </nav>

    <div class="container mt-4">

        <!-- ENCABEZADO CENTRADO -->
        <div class="text-center mb-2">
            <h2 class="mb-0">Libros</h2>
            <p class="text-muted mb-0">Sistema de Gestión de Libros</p>
        </div>

        <!-- BOTÓN VERDE ALINEADO A LA DERECHA -->
        <div class="d-flex justify-content-end mb-3 pe-2">
            <a th:href="@{/libros/new_libro}" class="btn btn-success">
                + Nuevo Libro
            </a>
        </div>

        <!-- TABLA CENTRADA -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <table class="table table-striped table-hover mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Titulo</th>
                                    <th>Genero</th>
                                    <th>Autor</th>
                                    <th>Opciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="libro : ${libros}">
								    <td th:text="${libro.id}"></td>
								    <td th:text="${libro.titulo}"></td>
								    <td th:text="${libro.genero}"></td>
								    <td th:text="${libro.autor.nombre}"></td>  <!-- ← columna autor -->
								    <td>
								        <a th:href="@{/libros/edite/{id}(id=${libro.id})}" class="btn btn-warning btn-sm">Editar</a>
								        <a th:href="@{/libros/delete/{id}(id=${libro.id})}" class="btn btn-danger btn-sm"
								           onClick="return confirm('¿Está seguro que desea eliminar el Libro?');">Eliminar</a>
								    </td>
								</tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
	   <!-- Pantalla éxito -->
	<div class="pantalla-completa" th:if="${exito}" id="pantalla">
	    <div class="contenido">
	        <span class="sistema-nombre">Biblioteca Salarrue</span>
	        <div class="circulo circulo-exito">
	            <span class="icono-exito">✔</span>
	        </div>
	        <p class="mensaje" th:text="${exito}"></p>
	        <p class="submensaje">Redirigiendo en unos segundos...</p>
	    </div>
	</div>
	
	<!-- Pantalla error -->
	<div class="pantalla-completa" th:if="${error}" id="pantalla">
	    <div class="contenido">
	        <span class="sistema-nombre">Biblioteca Salarrue</span>
	        <div class="circulo circulo-error">
	            <span class="icono-error">✖</span>
	        </div>
	        <p class="mensaje" th:text="${error}"></p>
	        <p class="submensaje">Por favor intenta de nuevo.</p>
	    </div>
	</div>
	
	<script>
	    setTimeout(() => {
	        const pantalla = document.getElementById('pantalla');
	        if (pantalla) pantalla.remove();
	    }, 2000);
	</script>
	
</body>
</html>
