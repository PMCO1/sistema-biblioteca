<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Lbros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="card-title mb-0">Registrar Libro</h4>
                    </div>
                    <div class="card-body">
                        
                        <form th:action="@{/libros/save}" th:object="${libro}" method="post">
                        
                        	<input type="hidden" th:field="*{id}">
                            
                            <div class="mb-3">
                                <label for="titulo" class="form-label">Titulo</label>
                                <input type="text" th:field="*{titulo}" class="form-control" id="titulo" name="titulo" placeholder="Ingresa el titlo del libro" required>
                            </div>

                            <div class="mb-3">
                                <label for="genero" class="form-label">Genero</label>
                                <input type="text" th:field="*{genero}" class="form-control" id="genero" name="genero" placeholder="Ej. Comedia, Terror, Historia" required>
                            </div>
                            
                            <div class="mb-3">
							    <label for="autor" class="form-label">Autor</label>
							    <select th:field="*{autor}" class="form-select" required>
							        <option value="">-- Selecciona un autor --</option>
							        <option th:each="autor : ${autores}"
							                th:value="${autor.id}"
							                th:text="${autor.nombre}">
							        </option>
							    </select>
							</div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success">Guardar</button>
                                <a th:href="@{/libros}" class="btn btn-secondary w-100">Cancelar</a>
                            </div>

                        </form>
                        
                    </div>
                </div>
                </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
